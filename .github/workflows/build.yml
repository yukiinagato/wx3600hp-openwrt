name: Build experimental components
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl subversion zstd
      - name: Prepare pinned source and build
        run: JOBS=4 ./tools/build.sh
      - name: Archive complete source inputs alongside binaries
        run: |
          git archive --format=tar.gz -o out/port-source.tar.gz HEAD
          tar --exclude=.git --exclude=./build_dir --exclude=./staging_dir --exclude=./tmp --exclude=./bin --exclude=./logs --exclude=./key-build* --exclude=./*.pem \
            -czf out/openwrt-source-inputs.tar.gz -C work/openwrt .
          cp work/openwrt/.config out/build.config
          cp sources.lock.json out/
      - uses: actions/upload-artifact@v4
        with:
          name: wx3600hp-experimental-components-and-source
          path: out/
          retention-days: 14
      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wx3600hp-build-diagnostics
          path: |
            work/openwrt/logs/
            work/openwrt/.config
          if-no-files-found: ignore
